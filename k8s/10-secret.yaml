# =============================================================================
#  Secret — livrable 5 : « un secret pour la configuration sensible »
#
#  /!\ AVERTISSEMENT PEDAGOGIQUE
#  Les valeurs ci-dessous sont des identifiants de LABORATOIRE, volontairement
#  versionnes pour que le projet soit reproductible en une commande. En
#  production on ne committe JAMAIS un Secret : on le cree hors du depot
#
#      kubectl -n todo-app create secret generic todo-db-credentials \
#        --from-literal=DB_USER=todo \
#        --from-literal=DB_PASSWORD="$(openssl rand -base64 24)" \
#        --from-literal=DB_NAME=tododb
#
#  ou on delegue a un gestionnaire externe (HashiCorp Vault, Sealed Secrets,
#  External Secrets Operator), comme recommande dans le cours IaC
#  (« ne pas hardcoder les cles dans les scripts »).
#
#  A noter : un Secret Kubernetes n'est encode qu'en base64, pas chiffre. Sa
#  protection repose sur le chiffrement d'etcd et le RBAC du cluster.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: todo-db-credentials
  namespace: todo-app
  labels:
    app.kubernetes.io/name: todo-devops
    app.kubernetes.io/component: database
type: Opaque
# stringData evite d'avoir a encoder soi-meme en base64 : Kubernetes s'en
# charge a l'admission. Le contenu reste lisible dans le depot, cf. avis ci-dessus.
stringData:
  DB_USER: todo
  DB_PASSWORD: ch4nge-me-in-production
  DB_NAME: tododb
  # Chaine de connexion complete, utile aux outils d'administration.
  DATABASE_URL: postgresql://todo:ch4nge-me-in-production@todo-postgres:5432/tododb
