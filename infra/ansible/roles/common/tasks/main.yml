---
# =============================================================================
#  Rôle common — socle appliqué aux deux nœuds.
#  Paquets de base, Git, fuseau horaire, résolution de noms inter-nœuds.
# =============================================================================

- name: Rafraîchir le cache apt (au plus une fois par heure)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets de base
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - ca-certificates
      - gnupg
      - lsb-release
      - apt-transport-https
      - software-properties-common
      - unzip
      - jq
      - rsync
      - net-tools
      - iproute2
      - dnsutils
      - htop
      - vim
      - acl # requis par become_user vers un compte non privilégié
      - python3-pip
      - python3-setuptools
    state: present

# Le module community.general.timezone s'appuie sur timedatectl, dont le
# service systemd-timedated n'est pas fiable dans un nœud conteneurisé. La
# méthode ci-dessous — les deux fichiers que lit réellement la glibc — est
# déterministe et donne le même résultat.
- name: Déclarer le fuseau horaire
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ timezone }}\n"
    mode: "0644"

- name: Activer le fuseau horaire
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Déclarer les deux nœuds dans /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE — nœuds du projet {{ project_name }}"
    block: |
      {{ node_jenkins_ip }} node-jenkins
      {{ node_k8s_ip }} node-k8s

- name: Configurer Git au niveau système
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: system
  loop:
    # safe.directory=* : sans cela Git refuse d'opérer sur un dépôt cloné par
    # un autre utilisateur — exactement le cas d'un workspace Jenkins.
    - { name: "init.defaultBranch", value: "main" }
    - { name: "pull.rebase", value: "false" }
    - { name: "safe.directory", value: "*" }

- name: Créer le répertoire de métadonnées du projet
  ansible.builtin.file:
    path: /etc/devops
    state: directory
    mode: "0755"

- name: Écrire le marqueur de provisionnement
  ansible.builtin.copy:
    dest: /etc/devops/provisioned
    mode: "0644"
    content: |
      # Nœud configuré par Ansible — ne pas modifier à la main.
      project={{ project_name }}
      role={{ 'ci' if inventory_hostname in groups['jenkins'] else 'kubernetes' }}
      hostname={{ inventory_hostname }}
      ip={{ ansible_host }}
      provisioned_at={{ ansible_date_time.iso8601 | default('unknown') }}
