---
# =============================================================================
#  Rôle kubernetes — installe kubectl et démarre un cluster minikube.
#
#  Le nœud tourne en mode privilégié et dispose de son propre démon Docker :
#  minikube utilise donc son driver `docker` et crée son nœud comme conteneur
#  imbriqué. Trois options sont indispensables ici :
#
#    --force              : minikube refuse par défaut de tourner en root ;
#    --listen-address=0.0.0.0 : sans cela l'API server n'écoute que sur la
#                           boucle locale du nœud et Jenkins ne peut pas
#                           l'atteindre ;
#    --apiserver-ips      : ajoute l'IP du nœud aux SAN du certificat, sinon
#                           kubectl à distance échoue sur la vérification TLS.
#
#  On ne force PAS le cgroup-driver du kubelet : minikube l'aligne lui-même sur
#  celui du runtime de son nœud. Le fixer à « systemd » alors que le Docker
#  interne au nœud minikube utilise « cgroupfs » empêche le kubelet de démarrer.
# =============================================================================

# --------------------------------------------------------------------- kubectl
- name: Installer la clé GPG du dépôt Kubernetes
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"
    timeout: 60
  register: k8s_key_download
  retries: 3
  delay: 5
  until: k8s_key_download is succeeded

- name: Déclarer le dépôt Kubernetes
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes.asc]
      https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/ /
    filename: kubernetes
    state: present
    update_cache: true

- name: Installer kubectl et les dépendances du kubelet
  ansible.builtin.apt:
    name:
      - kubectl
      - conntrack # exigé par minikube quel que soit le driver
      - socat
      - ethtool
    state: present

# -------------------------------------------------------------------- minikube
# Deux pièges, rencontrés l'un après l'autre sur une liaison lente :
#
#   1. garder « when: not stat.exists » comme garde d'idempotence accepte un
#      binaire tronqué laissé par un transfert interrompu. minikube plantait
#      alors en SIGSEGV à chaque appel, sans jamais être retéléchargé.
#   2. get_url s'appuie sur urlopen, qui ne reprend pas un transfert coupé :
#      chaque tentative repart de l'octet zéro. Sur 136 Mo à débit instable,
#      la tâche n'aboutit jamais.
#
# D'où : curl avec « -C - » (reprise à l'octet atteint) et un garde-fou de
# débit, puis mise en place du binaire seulement après vérification de la
# somme de contrôle officielle. La comparaison d'empreintes rend la séquence
# idempotente et auto-réparatrice.
- name: Récupérer la somme de contrôle officielle de minikube
  ansible.builtin.uri:
    url: "{{ minikube_url }}.sha256"
    return_content: true
  register: minikube_sha
  retries: 5
  delay: 5
  until: minikube_sha is succeeded

- name: Relever l'empreinte du binaire minikube déjà installé
  ansible.builtin.stat:
    path: /usr/local/bin/minikube
    checksum_algorithm: sha256
  register: minikube_binary

- name: Installer minikube si absent ou corrompu
  when: minikube_binary.stat.checksum | default('') != minikube_sha.content | trim
  block:
    - name: Télécharger le binaire minikube (curl, reprise sur coupure)
      ansible.builtin.command:
        argv:
          - curl
          - -fL
          - --retry
          - "15"
          - --retry-delay
          - "5"
          - --retry-all-errors
          - --connect-timeout
          - "30"
          # Relance le transfert si le débit reste sous 1 ko/s pendant 2 min.
          - --speed-limit
          - "1024"
          - --speed-time
          - "120"
          - -C
          - "-"
          - -o
          - /usr/local/bin/.minikube.part
          - "{{ minikube_url }}"
      changed_when: true

    - name: Relever l'empreinte du binaire téléchargé
      ansible.builtin.stat:
        path: /usr/local/bin/.minikube.part
        checksum_algorithm: sha256
      register: minikube_part

    - name: Refuser un binaire dont la somme de contrôle ne correspond pas
      ansible.builtin.assert:
        that: minikube_part.stat.checksum == minikube_sha.content | trim
        fail_msg: >-
          Somme de contrôle invalide pour minikube — attendu
          {{ minikube_sha.content | trim }}, obtenu
          {{ minikube_part.stat.checksum }}. Le téléchargement est incomplet.

    - name: Mettre le binaire minikube en place
      ansible.builtin.copy:
        src: /usr/local/bin/.minikube.part
        dest: /usr/local/bin/minikube
        remote_src: true
        mode: "0755"

    - name: Retirer le fichier de téléchargement temporaire
      ansible.builtin.file:
        path: /usr/local/bin/.minikube.part
        state: absent

- name: Vérifier que le binaire minikube est exécutable
  ansible.builtin.command: /usr/local/bin/minikube version --short
  register: minikube_version
  changed_when: false

- name: Charger les modules noyau requis par le réseau Kubernetes
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  # Sous WSL2 ces modules sont compilés dans le noyau : le chargement échoue
  # alors qu'ils sont déjà disponibles. On n'interrompt donc pas le playbook.
  failed_when: false

- name: Activer le routage et le bridge netfilter
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { key: net.ipv4.ip_forward, value: "1" }
  failed_when: false

# --------------------------------------------------------- démarrage du cluster
- name: Vérifier l'état du cluster minikube
  ansible.builtin.command: minikube status --format '{% raw %}{{.Host}}{% endraw %}'
  environment:
    MINIKUBE_HOME: /root/.minikube
    CHANGE_MINIKUBE_NONE_USER: "true"
  register: minikube_status
  changed_when: false
  failed_when: false

- name: Démarrer le cluster minikube
  ansible.builtin.command: >-
    minikube start
      --driver=docker
      --force
      --container-runtime=docker
      --cpus={{ minikube_cpus }}
      --memory={{ minikube_memory_mb }}
      --listen-address=0.0.0.0
      --apiserver-port={{ kubernetes_apiserver_port }}
      --apiserver-ips={{ node_k8s_ip }}
      --apiserver-names=node-k8s
      --wait=all
  environment:
    MINIKUBE_HOME: /root/.minikube
    MINIKUBE_IN_STYLE: "false"
  register: minikube_start
  when: minikube_status.stdout != "Running"
  changed_when: minikube_start.rc == 0
  # Le premier démarrage télécharge l'image kicbase (~1 Go) puis les images du
  # plan de contrôle : 10 minutes de marge sont nécessaires.
  async: 900
  poll: 15

- name: Attendre que tous les nœuds du cluster soient Ready
  ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=300s
  environment:
    KUBECONFIG: /root/.kube/config
  register: nodes_ready
  changed_when: false
  retries: 3
  delay: 10
  until: nodes_ready.rc == 0

- name: Activer les modules complémentaires utiles
  ansible.builtin.command: "minikube addons enable {{ item }}"
  environment:
    MINIKUBE_HOME: /root/.minikube
  loop:
    - default-storageclass
    - storage-provisioner
    - metrics-server
  register: addon_result
  changed_when: "'enabled' in addon_result.stdout | lower"
  failed_when: false

# ------------------------------------------- exposition de l'API server
# Avec le driver docker, minikube publie l'API server sur un port ALÉATOIRE de
# l'hôte (32771, 33012…) et son kubeconfig pointe sur l'IP interne du nœud
# minikube (192.168.49.2) : inaccessible depuis le nœud Jenkins.
# --listen-address et --apiserver-port ne changent pas ce comportement, or le
# kubeconfig distant généré plus bas annonce {{ node_k8s_ip }}:{{ kubernetes_apiserver_port }}.
# Sans relais, le pipeline échoue sur « connection refused ».
- name: Déployer le relais vers l'API server du cluster
  ansible.builtin.copy:
    dest: /usr/local/bin/k8s-apiserver-proxy.sh
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Relaie le port {{ kubernetes_apiserver_port }} du nœud vers l'API server
      # de minikube. L'IP est résolue au démarrage du service : elle peut
      # changer d'un « minikube start » à l'autre.
      set -euo pipefail
      export MINIKUBE_HOME=/root/.minikube
      ip="$(minikube ip)"
      exec socat TCP-LISTEN:{{ kubernetes_apiserver_port }},fork,reuseaddr "TCP:${ip}:8443"
  register: proxy_script

- name: Déclarer le service du relais API
  ansible.builtin.copy:
    dest: /etc/systemd/system/k8s-apiserver-proxy.service
    mode: "0644"
    content: |
      [Unit]
      Description=Relais TCP vers l'API server du cluster minikube
      After=docker.service
      Requires=docker.service

      [Service]
      ExecStart=/usr/local/bin/k8s-apiserver-proxy.sh
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  register: proxy_unit

- name: Activer et démarrer le relais API
  ansible.builtin.systemd:
    name: k8s-apiserver-proxy
    state: "{{ 'restarted' if (proxy_script is changed or proxy_unit is changed) else 'started' }}"
    enabled: true
    daemon_reload: true

- name: Vérifier que l'API server répond sur le port du nœud
  ansible.builtin.wait_for:
    host: "{{ node_k8s_ip }}"
    port: "{{ kubernetes_apiserver_port }}"
    timeout: 60

# ------------------------------------------------- kubeconfig pour l'extérieur
- name: Récupérer l'adresse interne du nœud minikube
  ansible.builtin.command: minikube ip
  environment:
    MINIKUBE_HOME: /root/.minikube
  register: minikube_ip
  changed_when: false

- name: Générer un kubeconfig utilisable depuis un autre nœud
  # Le kubeconfig local pointe sur 127.0.0.1 : inexploitable depuis Jenkins.
  # On le recopie en remplaçant l'adresse du serveur par l'IP du nœud, et on
  # embarque les certificats en base64 pour qu'il soit autoportant.
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      export KUBECONFIG=/root/.kube/config
      kubectl config view --raw --flatten > /etc/devops/kubeconfig-remote
      sed -i "s|server: https://[^ ]*|server: https://{{ node_k8s_ip }}:{{ kubernetes_apiserver_port }}|" \
        /etc/devops/kubeconfig-remote
      chmod 0600 /etc/devops/kubeconfig-remote
  changed_when: true

- name: Rapatrier le kubeconfig distant sur le contrôleur Ansible
  ansible.builtin.fetch:
    src: /etc/devops/kubeconfig-remote
    dest: "/tmp/{{ project_name }}-kubeconfig"
    flat: true

- name: Résumer l'état du cluster
  ansible.builtin.debug:
    msg:
      - "minikube démarré — nœud interne {{ minikube_ip.stdout }}"
      - "API server accessible sur https://{{ node_k8s_ip }}:{{ kubernetes_apiserver_port }}"
      - "kubeconfig distant : /etc/devops/kubeconfig-remote"
