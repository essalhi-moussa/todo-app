<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO DevOps — Gestion des tâches</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Gestion des tâches</h1>
    <p class="subtitle">
      Projet DevOps &amp; Intégration Continue —
      <span id="meta">chargement…</span>
    </p>
  </header>

  <main>
    <form id="new-task" autocomplete="off">
      <input id="title" name="title" type="text" maxlength="200"
             placeholder="Nouvelle tâche…" required>
      <button type="submit">Ajouter</button>
    </form>

    <p id="error" class="error" hidden></p>

    <section class="board">
      <div class="column">
        <h2>À faire <span class="count" id="count-todo">0</span></h2>
        <ul id="list-todo"></ul>
      </div>
      <div class="column">
        <h2>Terminées <span class="count" id="count-done">0</span></h2>
        <ul id="list-done"></ul>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
