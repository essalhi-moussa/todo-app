# =============================================================================
#  Service d'exposition — livrable 5 : « le service d'exposition (NodePort ou
#  LoadBalancer) ».
#
#  NodePort a ete retenu car minikube ne dispose pas de controleur de
#  LoadBalancer natif : un Service de type LoadBalancer resterait
#  indefiniment en etat <pending> sans `minikube tunnel`.
#
#  Chemin d'acces complet :
#     navigateur (Windows) -> localhost:8081
#       -> port publie du noeud node-k8s (Terraform)
#         -> NGINX sur le noeud (role Ansible nginx)
#           -> NodePort 30080 du cluster (ce Service)
#             -> pods todo-app (port 3000)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: todo-app
  namespace: todo-app
  labels:
    app.kubernetes.io/name: todo-devops
    app.kubernetes.io/component: app
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: todo-devops
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: http
      # Port fixe et non aleatoire : la configuration NGINX generee par
      # Ansible pointe dessus, il ne doit pas changer entre deux applications
      # des manifestes.
      nodePort: 30080
