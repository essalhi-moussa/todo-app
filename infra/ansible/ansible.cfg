# =============================================================================
#  Configuration Ansible du projet.
#
#  ATTENTION : si le dépôt est cloné sous /mnt/c (système de fichiers Windows
#  vu depuis WSL), Ansible ignore ce fichier car le répertoire est considéré
#  « world-writable ». Exporter alors ANSIBLE_CONFIG explicitement :
#      export ANSIBLE_CONFIG="$PWD/ansible.cfg"
#  Le script infra/02-configure.sh le fait pour vous.
# =============================================================================

[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
stdout_callback       = yaml
interpreter_python   = /usr/bin/python3
forks                = 10
timeout              = 60

# Accélère les exécutions répétées (les faits ne sont recollectés qu'une fois
# par heure), utile quand on itère sur un rôle.
gathering        = smart
fact_caching     = jsonfile
fact_caching_connection = /tmp/ansible-facts-todo-devops
fact_caching_timeout    = 3600

[ssh_connection]
# ControlMaster réutilise une seule session SSH pour toutes les tâches d'un
# hôte : divise par 5 à 10 la durée d'un playbook.
ssh_args    = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining  = True
